# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod download
    - go generate ./...
builds:
  - id: yadmb-linux-amd64
    binary: yadmb
    env:
      - CGO_ENABLED=1
      # libdave is installed here by the libdave install script.
      - PKG_CONFIG_PATH=/home/runner/.local/lib/pkgconfig
    goos:
      - linux
    goarch:
      - amd64
  # arm64 is cross-compiled from the amd64 runner with the aarch64 GNU
  # toolchain. Opus is built from source (static) and the prebuilt arm64
  # libdave is registered with pkg-config, both under /opt/arm64.
  - id: yadmb-linux-arm64
    binary: yadmb
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - CXX=aarch64-linux-gnu-g++
      # Opus is linked statically, so its math dependency must be explicit.
      - CGO_LDFLAGS=-lm
      - PKG_CONFIG_LIBDIR=/opt/arm64/lib/pkgconfig
      - PKG_CONFIG_PATH=
    goos:
      - linux
    goarch:
      - arm64
archives:
  - formats: zip
    files:
      - README.md
      - LICENSE
      - example_config.yml
checksum:
  name_template: checksums.txt
snapshot:
  version_template: '{{ .Tag }}-next'
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
